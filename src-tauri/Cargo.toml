[package]
name = "shorts-studio"
version = "0.1.0"
description = "Shorts Studio desktop app: the Next.js UI in a native window, with the Python video engine as a sidecar"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
