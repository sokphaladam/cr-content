# Builds the desktop app's installers and publishes them on GitHub.
#
#   git tag v0.2.0 && git push origin v0.2.0   → a draft release "Shorts Studio v0.2.0" with the Windows installer and
#                                                 the macOS disk images (Apple Silicon and Intel); publish it on GitHub
#   Actions → Release → Run workflow          → the same builds as downloadable artifacts, without a release
#
# The version comes from the tag (v0.2.0 → 0.2.0). Each build bundles the frozen Python engine
# (scripts/build_engine.py) and FFmpeg (scripts/fetch_ffmpeg.py), so the installed app needs nothing else.
#
# Updates: releases also carry the signed update files and latest.json that installed apps check (Settings → About &
# updates). They're signed with the key in the TAURI_SIGNING_PRIVATE_KEY secret (its public half is in
# src-tauri/tauri.conf.json); installed apps see a release once it's published, not while it's a draft.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the installers

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS (Apple Silicon)
            os: macos-15
          - name: macOS (Intel)
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Update signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret (Settings → Secrets and variables → Actions): installed apps only accept updates signed with it."
            exit 1
          fi

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const fs = require("fs"), f = "src-tauri/tauri.conf.json", v = process.argv[1];
            if (!/^\d+\.\d+\.\d+$/.test(v)) throw new Error(`Tag must look like v1.2.3, got ${v}`);
            const c = JSON.parse(fs.readFileSync(f, "utf8")); c.version = v;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          ' "${GITHUB_REF_NAME#v}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Python engine dependencies
        run: |
          python -m venv .venv
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements.txt -r requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Node dependencies
        run: |
          npm ci
          npm ci --prefix frontend

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Freeze the engine
        run: python scripts/build_engine.py

      - name: Bundle FFmpeg
        run: |
          if [ -x .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" scripts/fetch_ffmpeg.py

      - name: Build the installer (and attach it to the release)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # tagged builds also make the signed update files (tauri.updater.json); manual runs just the installers
          args: --config src-tauri/tauri.bundle.json ${{ startsWith(github.ref, 'refs/tags/v') && '--config src-tauri/tauri.updater.json' || '' }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Shorts Studio ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            ## Install

            **Windows**: download `Shorts Studio_…_x64-setup.exe` and run it. The installer isn't code-signed yet, so
            Windows SmartScreen may warn: choose **More info → Run anyway**.

            **macOS**: download the `.dmg` for your Mac (`aarch64` for Apple Silicon M1/M2/M3/M4, `x64` for Intel),
            open it and drag Shorts Studio to Applications. The app isn't notarized by Apple yet, so the first time:
            open it, then go to **System Settings → Privacy & Security** and choose **Open Anyway**.

            FFmpeg is included. Add your API keys in the app under **Settings**.

            Already installed? The app finds this version by itself (**Settings → About & updates**).

      - name: Keep the installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Shorts Studio - ${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
